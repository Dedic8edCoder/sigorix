name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lint (syntax + JSON)
        run: npm run lint
      - name: Unit and structural tests (builds the site)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser for smoke and accessibility checks
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser smoke test (all routes, 5 viewports)
        run: npm run smoke
      - name: Accessibility audit (contrast, labels, keyboard)
        run: npm run a11y
